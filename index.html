<!DOCTYPE html>
<html lang="pt-br">
<head>

<!-- Link para o Manifesto -->
<link rel="manifest" href="manifest.json">

<!-- Configurações de App para iOS (iPhone) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PontoPro">

<script>
  // Registra o "Service Worker" para o app funcionar offline
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log("PWA Ativo!"))
      .catch(err => console.log("Erro no PWA:", err));
  }
</script>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCS Bate Ponto - Spazio Ouro Verde</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 10px; border-radius: 10px; box-shadow: 0 4px 5px rgba(0,0,0,0.1); width: 80%; max-width: 450px; text-align: center; box-sizing: border-box; margin-bottom: 15px; }
        #relogio { font-size: 32px; font-weight: bold; color: #1a73e8; margin-bottom: 10px; }
        #data-atual { font-size: 16px; color: #666; margin-bottom: 20px; }
        #container-camera { width: 80%; height: 280px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 15px; position: relative; border: 3px solid #1a73e8; }
        #video { width: 80%; height: 80%; object-fit: cover; transform: scaleX(-1); }
        select, button, input { width: 80%; padding: 15px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        button { background: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-saida { background: #d93025; }
        table { width: 80%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .foto-ponto { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; }


    
    /* 1. RESET GLOBAL & BOX-SIZING (Crucial para não quebrar o layout) */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    /* 2. CENTRALIZAR O CARD NA TELA INTEIRA (Usando Flexbox) */
    body {
        font-family: sans-serif;
        background-color: #f0f2f5;
        
        /* Estas 4 linhas fazem a mágica de centralizar tudo na tela */
        display: flex;
        flex-direction: column; /* Elementos um abaixo do outro */
        align-items: center;    /* Centraliza horizontalmente */
        justify-content: center; /* Centraliza verticalmente */
        
        min-height: 100vh; /* Ocupa pelo menos a altura total da tela */
        padding: 20px; /* Margem de segurança para não encostar nas bordas */
    }

    /* 3. ESTILO DO CARD DE PONTO */
    .card-ponto {
        background: white;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        width: 100%;
        max-width: 400px; /* Largura máxima para não ficar gigante em tablets */
        text-align: center;
        
        /* Margem inferior caso haja outro card abaixo */
        margin-bottom: 20px; 
    }

    /* 4. CENTRALIZAR A CÂMERA DENTRO DO SEU CONTAINER */
    #container-camera {
        width: 100%;
        height: 280px; /* Altura fixa para a área da câmera */
        background-color: #000; /* Fundo preto caso a câmera demore a abrir */
        border-radius: 12px;
        overflow: hidden; /* Corta o que sobrar do vídeo */
        margin-bottom: 15px;
        border: 3px solid #1a73e8; /* Borda azul de destaque */

        /* Centralizar o elemento <video> dentro deste container */
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* 5. ESTILO DO ELEMENTO VIDEO */
    #video {
        /* Garante que o vídeo preencha o container sem distorcer */
        min-width: 100%;
        min-height: 100%;
        object-fit: cover; /* Recorta o vídeo para preencher a área mantendo a proporção */
        
        /* Espelhar a imagem (efeito espelho), comum em câmeras frontais */
        transform: scaleX(-1);
    }
</style>
    </style>
</head>
<body>

    <!-- TELA DE REGISTRO (INICIAL) -->
<div id="tela-ponto" class="card-ponto">
    <div id="relogio">00:00:00</div>
    <div id="container-camera">
        <video id="video" autoplay playsinline></video>
    </div>
    
    <select id="funcionario">
        <option value="">Selecione seu nome</option>
        <option value="João Silva">João Silva</option>
        <option value="Maria Oliveira">Maria Oliveira</option>
        <option value="Carlos Santos">Carlos Santos</option>
        <option value="Ana Costa">Ana Costa</option>
        <option value="Fernanda Lima">Fernanda Lima</option>       
        
        
        <!-- ... outros nomes ... -->
    </select>

    <div style="display: flex; gap: 10px;">
        <button onclick="registrarPonto('Entrada')">ENTRADA</button>
        <button class="btn-saida" onclick="registrarPonto('Saída')">SAÍDA</button>
    </div>

   <!-- Botão discreto para abrir o login do admin -->
    <button onclick="mostrarLogin()" style="background: none; color: #999; font-size: 12px; margin-top: 15px; border: none;">Acesso Restrito</button>
</div>

<!-- TELA ADMINISTRATIVA (ESCONDIDA POR PADRÃO) -->
<div id="tela-admin" class="card-admin" style="display: none;">
    <h3>Painel do Gestor</h3>

    <!-- Formulário de Login -->
    <div id="login-admin">
        <input type="password" id="senha-admin" placeholder="Senha mestre">
        <button onclick="acessarAdmin()">ENTRAR NO PAINEL</button>
        <button onclick="voltarParaPonto()" style="background: #ccc; margin-top: 5px;">VOLTAR</button>
    </div>

    <!-- Conteúdo do Painel (Só aparece após a senha) -->
    <div id="conteudo-admin" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h4 id="contador-registros">Registros: 0</h4>
        <button onclick="exportarCSV()" style="background: #188038; width: auto; padding: 10px 20px;">EXPORTAR EXCEL</button>
    </div>

    <div style="overflow-x: auto; max-height: 400px;">
        <table id="tabela-ponto">
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Informações</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </div>

    <!-- Seção de Limpeza -->
    <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee;">
        <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Atenção: A limpeza apaga todas as fotos e registros permanentemente deste aparelho.</p>
        <button onclick="limparBancoDeDados()" style="background: #d93025;">LIMPAR TODOS OS DADOS (30 DIAS)</button>
        <button onclick="voltarParaPonto()" style="background: #6c757d; margin-top: 10px;">SAIR DO PAINEL</button>
    </div>
</div>




    <canvas id="canvas" style="display:none;" width="320" height="240"></canvas>

    <script>
        const SENHA_MESTRE = "1234";
        let db;

        // --- 1. CONFIGURAÇÃO DO INDEXEDDB ---
        const request = indexedDB.open("RH_PontoDB", 1);

        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("pontos")) {
                db.createObjectStore("pontos", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = (e) => { db = e.target.result; };

        // --- 2. CÂMERA E RELÓGIO ---
        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                document.getElementById('video').srcObject = stream;
            } catch (err) { alert("Câmera não autorizada."); }
        }

        setInterval(() => {
            const agora = new Date();
            document.getElementById('relogio').innerText = agora.toLocaleTimeString('pt-BR');
            document.getElementById('data-atual').innerText = agora.toLocaleDateString('pt-BR', { dateStyle: 'full' });
        }, 1000);

        // --- 3. REGISTRO DE PONTO ---
        async function registrarPonto(tipo) {
            const nome = document.getElementById('funcionario').value;
            if (!nome) return alert("Selecione um nome!");

            const canvas = document.getElementById('canvas');
            const video = document.getElementById('video');
            const ctx = canvas.getContext('2d');
            
            // Captura a foto
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const foto = canvas.toDataURL('image/jpeg', 0.6);

            const agora = new Date();
            const registro = {
                nome,
                tipo,
                foto,
                hora: agora.toLocaleTimeString('pt-BR'),
                data: agora.toLocaleDateString('pt-BR'),
                dia: agora.toLocaleDateString('pt-BR', { weekday: 'short' }),
                timestamp: agora.getTime()
            };

            // Salva no IndexedDB
            const trans = db.transaction(["pontos"], "readwrite");
            const store = trans.objectStore("pontos");
            store.add(registro);

            trans.oncomplete = () => {
                alert(`Ponto de ${tipo} confirmado para ${nome}!`);
                document.getElementById('funcionario').value = "";
            };
        }

        // --- 4. ÁREA ADMINISTRATIVA ---
        function acessarAdmin() {
            if (document.getElementById('senha-admin').value === SENHA_MESTRE) {
                document.getElementById('area-admin').style.display = 'block';
                listarPontos();
            } else { alert("Senha incorreta!"); }
        }

        function listarPontos() {
            const corpo = document.getElementById('tabela-corpo');
            corpo.innerHTML = "";
            const store = db.transaction("pontos").objectStore("pontos");
            
            store.openCursor(null, "prev").onsuccess = (e) => {
                const cursor = e.target.result;
                if (cursor) {
                    const v = cursor.value;
                    corpo.innerHTML += `
                        <tr>
                            <td><img src="${v.foto}" class="foto-ponto"></td>
                            <td>${v.nome}<br><small>${v.data} (${v.dia}) - ${v.hora}</small></td>
                            <td>${v.tipo}</td>
                        </tr>
                    `;
                    cursor.continue();
                }
            };
        }

        function exportarCSV() {
            const store = db.transaction("pontos").objectStore("pontos");
            let csv = "Nome;Data;Dia;Hora;Tipo\n";
            
            store.openCursor().onsuccess = (e) => {
                const cursor = e.target.result;
                if (cursor) {
                    const v = cursor.value;
                    csv += `${v.nome};${v.data};${v.dia};${v.hora};${v.tipo}\n`;
                    cursor.continue();
                } else {
                    const blob = new Blob([csv], { type: 'text/csv' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'relatorio_ponto.csv';
                    a.click();
                }
            };
        }

        function deletarTudo() {
            if (confirm("Isso apagará permanentemente todos os registros do celular. Continuar?")) {
                const trans = db.transaction(["pontos"], "readwrite");
                trans.objectStore("pontos").clear();
                trans.oncomplete = () => listarPontos();
            }
        }

        window.onload = init;

        // Função para mostrar a tela de login
function mostrarLogin() {
    document.getElementById('tela-ponto').style.display = 'none';
    document.getElementById('tela-admin').style.display = 'block';
    document.getElementById('login-admin').style.display = 'block';
    document.getElementById('conteudo-admin').style.display = 'none';
}

// Função que valida a senha e libera o painel
function acessarAdmin() {
    const senha = document.getElementById('senha-admin').value;
    if (senha === SENHA_MESTRE) {
        document.getElementById('login-admin').style.display = 'none';
        document.getElementById('conteudo-admin').style.display = 'block';
        listarPontos(); // Carrega os dados do IndexedDB que fizemos antes
    } else {
        alert("Senha incorreta!");
    }
}

// Função para sair do painel e voltar para a câmera
function voltarParaPonto() {
    // Limpa o campo de senha por segurança
    document.getElementById('senha-admin').value = "";
    
    // Alterna as telas
    document.getElementById('tela-admin').style.display = 'none';
    document.getElementById('tela-ponto').style.display = 'block';
    
    // Reinicia a câmera caso ela tenha sido pausada pelo navegador
    init(); 
}

// Função para contar registros e atualizar na tela
function atualizarContador() {
    const trans = db.transaction(["pontos"], "readonly");
    const store = trans.objectStore("pontos");
    const countRequest = store.count();

    countRequest.onsuccess = () => {
        document.getElementById('contador-registros').innerText = `Registros: ${countRequest.result}`;
    };
}

// Função principal de limpeza
function limparBancoDeDados() {
    // 1. Confirmação de segurança
    const confirmacao1 = confirm("Você tem certeza que deseja apagar todos os registros?");
    if (!confirmacao1) return;

    const confirmacao2 = confirm("Aviso final: As fotos não poderão ser recuperadas. Você já exportou o Excel?");
    if (!confirmacao2) return;

    // 2. Operação de limpeza no IndexedDB
    const trans = db.transaction(["pontos"], "readwrite");
    const store = trans.objectStore("pontos");
    const requestLimpeza = store.clear();

    requestLimpeza.onsuccess = () => {
        alert("Banco de dados limpo com sucesso!");
        listarPontos(); // Atualiza a tabela (ficará vazia)
        atualizarContador(); // Reseta o contador
    };

    requestLimpeza.onerror = () => {
        alert("Erro ao tentar limpar os dados.");
    };
}

// Atualize sua função de acessarAdmin para carregar o contador
function acessarAdmin() {
    const senha = document.getElementById('senha-admin').value;
    if (senha === SENHA_MESTRE) {
        document.getElementById('login-admin').style.display = 'none';
        document.getElementById('conteudo-admin').style.display = 'block';
        listarPontos();
        atualizarContador(); // Chama a contagem ao entrar
    } else {
        alert("Senha incorreta!");
    }
}
        
    </script>
</body>
</html>
